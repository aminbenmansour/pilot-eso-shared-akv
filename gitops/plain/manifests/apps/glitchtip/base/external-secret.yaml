apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-env
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: azure-kv }
  target:
    name: glitchtip-env-eso # new name, the old Secret stays until cutover
    template:
      data:
        SECRET_KEY: "{{ .secret_key }}"
        DATABASE_URL: "postgresql://glitchtip:{{ .db_password | urlquery }}@<db-host>:5432/glitchtip"
        EMAIL_URL: "smtp://<user>:{{ .smtp_password | urlquery }}@<smtp-host>:587"
  data:
    - { secretKey: secret_key, remoteRef: { key: glitchtip--secret-key } }
    - { secretKey: db_password, remoteRef: { key: glitchtip--db-password } }
    - { secretKey: smtp_password, remoteRef: { key: glitchtip--smtp-password } }
