apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      # Replaced by the environment overlay for each cluster.
      vaultUrl: "https://kv-myproject-prod.vault.azure.net"
      serviceAccountRef:
        name: eso-glitchtip
