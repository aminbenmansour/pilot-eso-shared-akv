apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: eso-apps-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: eso-example
              operator: In
              values: ["true"]
            - key: env
              operator: In
              values: [prod]
  template:
    metadata:
      name: '{{.name}}-glitchtip'
      labels:
        app.kubernetes.io/part-of: eso-example
        env: '{{index .metadata.labels "env"}}'
    spec:
      project: eso-apps
      source:
        repoURL: https://github.com/aminbenmansour/pilot-eso-shared-akv.git
        targetRevision: main
        path: 'gitops/environments/{{index .metadata.labels "env"}}'
      destination:
        server: '{{.server}}'
        namespace: glitchtip
      # Production is synced manually after the pull request is approved.
      syncPolicy:
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
