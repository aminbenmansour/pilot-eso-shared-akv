name: gitops

on:
  pull_request:
    paths:
      - "gitops/**"
      - ".github/workflows/gitops.yml"
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - ".github/workflows/gitops.yml"

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  # Schema catalogue for CRDs (external-secrets.io, ...).
  CRD_SCHEMA_LOCATION: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

jobs:
  render:
    name: render and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/

      - name: Render and validate overlays
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            echo "::group::${env}"
            kubectl kustomize "gitops/environments/${env}" > "/tmp/${env}.yaml"
            kubeconform \
              -strict \
              -ignore-missing-schemas \
              -summary \
              -schema-location default \
              -schema-location "${CRD_SCHEMA_LOCATION}" \
              "/tmp/${env}.yaml"
            echo "::endgroup::"
          done

      - name: Validate platform manifests
        run: |
          kubeconform -strict -summary gitops/platform/
