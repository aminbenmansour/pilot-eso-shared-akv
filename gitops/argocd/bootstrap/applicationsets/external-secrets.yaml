apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: eso-platform-external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            eso-example: "true"
  template:
    metadata:
      name: '{{.name}}-external-secrets'
      labels:
        app.kubernetes.io/part-of: eso-example
    spec:
      project: eso-platform
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        # Bump deliberately; see gitops/argocd/README.md.
        targetRevision: 2.14.0
        helm:
          releaseName: external-secrets
          values: |
            installCRDs: true
      destination:
        server: '{{.server}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
