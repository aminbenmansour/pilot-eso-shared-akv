apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../apps/glitchtip/base

patches:
  - target:
      kind: SecretStore
      name: azure-kv
    patch: |-
      - op: replace
        path: /spec/provider/azurekv/vaultUrl
        value: https://kv-myproject-staging.vault.azure.net
  - target:
      kind: ExternalSecret
      name: glitchtip-env
    patch: |-
      - op: replace
        path: /spec/refreshInterval
        value: 15m
